server:
  port: 8080

spring:
  application:
    name: blog

  # MySQL 数据源（按需修改账号密码）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 生产环境通过 DB_PASSWORD 环境变量注入，冒号后为开发默认值
    password: ${DB_PASSWORD:123456}

  # Redis（Docker 容器 blog-redis 映射到宿主机 16379：
  # Windows 的 Hyper-V 保留端口段占用了 6379，绑定会报 socket forbidden）
  data:
    redis:
      host: localhost
      port: 16379
      database: 0
      # password:

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 消费者重试：失败自动重试 3 次后不再 requeue，经队列绑定的死信交换机转投 DLQ
    # （见 RabbitConfig），杜绝消费失败的消息无限 requeue 死循环
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

  # Elasticsearch（全文搜索；Spring Boot 3 的配置键是 uris，
  # Boot 2 时代的 spring.data.elasticsearch.cluster-nodes 已废弃）
  elasticsearch:
    uris: http://localhost:9200
    # 启动时按 ArticleDocument 注解自动建索引（不开启的话索引不存在，搜索永远无结果）
    auto-index-creation: true
    # 需要认证时打开：
    # username: elastic
    # password: your-password
    # 连接超时（毫秒）：
    # connection-timeout: 3s
    # socket-timeout: 60s

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.example.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除：deleted 字段 0 未删除 / 1 已删除（与 docs/design.md 表结构一致）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.example.blog: debug

# 自定义 JWT 配置（由 JwtProperties 配置类读取，见 config 包）
jwt:
  # 签名密钥：生产环境通过 JWT_SECRET 环境变量注入（HS512 要求 ≥64 字节），
  # 冒号后为开发默认值
  secret: ${JWT_SECRET:627d361efd9f4feff10aecfe60d3f848773ae6a82660f3eeec0515ad24f2053e9152d3d7b8a7f8f5c285f5c90522c3800642b16cfc80af772a361d018fb35cd4}
  # 过期时间（毫秒）：86400000 = 24 小时
  expiration: 86400000
