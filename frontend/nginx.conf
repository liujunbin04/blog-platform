# 前端 SPA 静态托管 + /api 反向代理到后端容器
#
# 注意：这里没有用 upstream { server blog-backend:8080; } 的写法。
# upstream 块里的域名是 Nginx 启动时解析一次并永久缓存 IP 的，
# 后端容器一旦重建换了 IP，代理就断了，只能重启 Nginx 才能恢复。
# 改用 resolver + 变量，让域名在每次请求时才解析，后端随便重建。
# 127.0.0.11 是 Docker 内嵌 DNS，只在 compose 网络内有效。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文章正文的 base64 图片可能较大，放宽请求体上限
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss application/atom+xml image/svg+xml;

    # ------------------------------------------------------------------
    # 后端 API 反向代理
    # 变量形式且不带路径，Nginx 会原样转发完整 URI（/api/articles → /api/articles）
    # ------------------------------------------------------------------
    location /api/ {
        set $backend "http://blog-backend:8080";
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # 静态资源：Vite 产物文件名带内容 hash，可以放心长缓存
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # SPA 回退：前端用的是 createWebHistory，刷新 /articles/123 这类
    # 深链接时服务器上并没有对应文件，必须回退到 index.html 交给前端路由
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
